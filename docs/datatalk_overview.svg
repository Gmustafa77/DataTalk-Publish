<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 570" width="1600" height="570" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>DataTalk.AI Overview</title>
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="stageShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1600" height="570" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="56" y="54" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">DataTalk.AI Overview</text>
  <text x="56" y="82" font-size="15" font-weight="500" fill="#475569">Ask questions in plain English. Receive data-grounded answers and interactive visuals from live data.</text>
  <!-- Main pipeline -->
  <rect x="52" y="108" width="1496" height="436" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Stage 1: Ask -->
  <g transform="translate(84,150)" filter="url(#stageShadow)">
    <rect x="0" y="14" width="248" height="296" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="59" y="0" width="130" height="30" rx="15" fill="#475569"/>
    <text x="124" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">1 · ASK</text>
    <circle cx="124" cy="82" r="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M112 72 h24 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-14 l-8 7 v-7 h-2 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="144" text-anchor="middle" font-size="17" font-weight="800" fill="#0F172A">User Question</text>
    <text x="124" y="166" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">Plain-English request</text>
    <line x1="24" y1="188" x2="224" y2="188" stroke="#CBD5E1"/>
    <circle cx="30" cy="216" r="3.5" fill="#475569"/>
    <text x="42" y="220" font-size="13" font-weight="700" fill="#1E293B">Business Intent</text>
    <text x="42" y="237" font-size="11.5" fill="#64748B">What the user wants to know</text>
    <circle cx="30" cy="264" r="3.5" fill="#475569"/>
    <text x="42" y="268" font-size="13" font-weight="700" fill="#1E293B">Question Context</text>
    <text x="42" y="285" font-size="11.5" fill="#64748B">Follow-up context when available</text>
  </g>
  <line x1="338" y1="310" x2="372" y2="310" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- Stage 2: Understand -->
  <g transform="translate(380,150)" filter="url(#stageShadow)">
    <rect x="0" y="14" width="248" height="296" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="44" y="0" width="160" height="30" rx="15" fill="#7C3AED"/>
    <text x="124" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">2 · UNDERSTAND</text>
    <circle cx="124" cy="82" r="32" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M124 66 L128 78 L140 82 L128 86 L124 98 L120 86 L108 82 L120 78 Z" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="124" y="144" text-anchor="middle" font-size="17" font-weight="800" fill="#2E1065">AI Reasoning</text>
    <text x="124" y="166" text-anchor="middle" font-size="12.5" font-weight="500" fill="#5B21B6">Plans the data query</text>
    <line x1="24" y1="188" x2="224" y2="188" stroke="#DDD6FE"/>
    <circle cx="30" cy="216" r="3.5" fill="#7C3AED"/>
    <text x="42" y="220" font-size="13" font-weight="700" fill="#2E1065">Business Context</text>
    <text x="42" y="237" font-size="11.5" fill="#6D28D9">Maps terms to available data fields</text>
    <circle cx="30" cy="264" r="3.5" fill="#7C3AED"/>
    <text x="42" y="268" font-size="13" font-weight="700" fill="#2E1065">SQL Generation</text>
    <text x="42" y="285" font-size="11.5" fill="#6D28D9">Builds a structured query</text>
  </g>
  <line x1="634" y1="310" x2="668" y2="310" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- Stage 3: Verify -->
  <g transform="translate(676,150)" filter="url(#stageShadow)">
    <rect x="0" y="14" width="248" height="296" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="54" y="0" width="140" height="30" rx="15" fill="#059669"/>
    <text x="124" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">3 · VERIFY</text>
    <circle cx="124" cy="82" r="32" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <path d="M124 66 l14 6 v10 c0 9 -6 16 -14 19 c-8 -3 -14 -10 -14 -19 v-10 z" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M118 82 l4 4 l8 -8" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="144" text-anchor="middle" font-size="17" font-weight="800" fill="#064E3B">Safety Guardrails</text>
    <text x="124" y="166" text-anchor="middle" font-size="12.5" font-weight="500" fill="#065F46">Checks before execution</text>
    <line x1="24" y1="188" x2="224" y2="188" stroke="#A7F3D0"/>
    <circle cx="30" cy="216" r="3.5" fill="#059669"/>
    <text x="42" y="220" font-size="13" font-weight="700" fill="#064E3B">Read-Only Policy</text>
    <text x="42" y="237" font-size="11.5" fill="#047857">Blocks write and destructive SQL</text>
    <circle cx="30" cy="264" r="3.5" fill="#059669"/>
    <text x="42" y="268" font-size="13" font-weight="700" fill="#064E3B">Query Validation</text>
    <text x="42" y="285" font-size="11.5" fill="#047857">Checks fields, syntax and row limits</text>
  </g>
  <line x1="930" y1="310" x2="964" y2="310" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- Stage 4: Execute -->
  <g transform="translate(972,150)" filter="url(#stageShadow)">
    <rect x="0" y="14" width="248" height="296" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="49" y="0" width="150" height="30" rx="15" fill="#2563EB"/>
    <text x="124" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">4 · EXECUTE</text>
    <circle cx="124" cy="82" r="32" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <ellipse cx="124" cy="72" rx="13" ry="5" fill="none" stroke="#2563EB" stroke-width="2.2"/>
    <path d="M111 72 v10 c0 2.8 5.8 5 13 5 s13 -2.2 13 -5 v-10 M111 82 v10 c0 2.8 5.8 5 13 5 s13 -2.2 13 -5 v-10" fill="none" stroke="#2563EB" stroke-width="2.2"/>
    <text x="124" y="144" text-anchor="middle" font-size="17" font-weight="800" fill="#1E3A8A">Live Data Query</text>
    <text x="124" y="166" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1E40AF">Runs against the database</text>
    <line x1="24" y1="188" x2="224" y2="188" stroke="#BFDBFE"/>
    <circle cx="30" cy="216" r="3.5" fill="#2563EB"/>
    <text x="42" y="220" font-size="13" font-weight="700" fill="#1E3A8A">Live Data Retrieval</text>
    <text x="42" y="237" font-size="11.5" fill="#1D4ED8">Reads current database results</text>
    <circle cx="30" cy="264" r="3.5" fill="#2563EB"/>
    <text x="42" y="268" font-size="13" font-weight="700" fill="#1E3A8A">Repair &amp; Retry</text>
    <text x="42" y="285" font-size="11.5" fill="#1D4ED8">Retries eligible query errors</text>
  </g>
  <line x1="1226" y1="310" x2="1260" y2="310" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- Stage 5: Deliver -->
  <g transform="translate(1268,150)" filter="url(#stageShadow)">
    <rect x="0" y="14" width="248" height="296" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="49" y="0" width="150" height="30" rx="15" fill="#B45309"/>
    <text x="124" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">5 · DELIVER</text>
    <circle cx="124" cy="82" r="32" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <line x1="110" y1="94" x2="138" y2="94" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="116" y1="94" x2="116" y2="82" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="124" y1="94" x2="124" y2="70" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="94" x2="132" y2="77" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <text x="124" y="144" text-anchor="middle" font-size="17" font-weight="800" fill="#78350F">Answer &amp; Visuals</text>
    <text x="124" y="166" text-anchor="middle" font-size="12.5" font-weight="500" fill="#92400E">Answer first, with evidence</text>
    <line x1="24" y1="188" x2="224" y2="188" stroke="#FDE68A"/>
    <circle cx="30" cy="216" r="3.5" fill="#B45309"/>
    <text x="42" y="220" font-size="13" font-weight="700" fill="#78350F">Plain-English Summary</text>
    <text x="42" y="237" font-size="11.5" fill="#B45309">Key findings and context</text>
    <circle cx="30" cy="264" r="3.5" fill="#B45309"/>
    <text x="42" y="268" font-size="13" font-weight="700" fill="#78350F">Chart, Table &amp; SQL</text>
    <text x="42" y="285" font-size="11.5" fill="#B45309">Visuals and query transparency</text>
  </g>

  <!-- Pipeline summary -->
  <rect x="330" y="484" width="940" height="38" rx="19" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="800" y="508" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">✦  Autonomous AI Pipeline: User Question → Validated Query → Data-Grounded Answer</text>
</svg>
